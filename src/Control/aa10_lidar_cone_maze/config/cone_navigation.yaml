aa10_cone_navigation:
  ros__parameters:
    # Inflation parameters
    inflation_radius: 0.08 # Inflation radius around obstacles (15cm for vehicle width 20cm + safety margin)

    # Ray scan parameters
    scan_angle_step: 5.0 # Angle step between rays (degrees)
    scan_range: 45.0 # Total scan range (±45 degrees)
    scan_distance: 2.0 # Maximum scan distance (meters)
    blocked_distance: 0.30 # Distance threshold for blocked path (meters) - paths with obstacles closer than this are blocked
    points_per_ray: 20 # Number of points per scan ray

    # Map parameters
    map_length: 1.5 # Forward distance (X axis) in meters
    map_width: 1.2 # Lateral width (Y axis) in meters
    map_resolution: 0.05 # Map resolution in meters per cell (5cm - good balance)

    # ROI (Region of Interest) parameters
    roi_width: 0.6 # Lateral ROI width (±0.6m = 1.2m total)
    roi_forward: 1.5 # Forward ROI distance in meters
