slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping  # Creates map while localizing (like Hector SLAM)

    # Hector-like configuration for scan-matching localization
    debug_logging: false
    throttle_scans: 3               # Reduce scan processing load (process every 3rd scan)
    transform_publish_period: 0.05  # Slightly slower for stability
    map_update_interval: 1.0        # Slower map updates to reduce queue load
    resolution: 0.05
    max_laser_range: 10.0           # Reduced range for better scan matching
    minimum_time_interval: 0.1      # Faster updates
    transform_timeout: 0.5          # Increased timeout for Gazebo simulation
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: false  # Disable for autonomous operation

    # Scan matching focused parameters (like Hector SLAM)
    use_scan_matching: true         # Primary localization method
    use_scan_barycenter: true       # Improve scan matching accuracy
    minimum_travel_distance: 0.1   # Very sensitive to movement
    minimum_travel_heading: 0.1    # Very sensitive to rotation
    scan_buffer_size: 20            # Larger buffer for better matching
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.2   # Stricter matching
    link_scan_maximum_distance: 0.8         # Close-range matching
    
    # Loop closure (minimal for real-time performance)
    loop_search_maximum_distance: 1.5       # Small search area
    do_loop_closing: true                    # Keep for accuracy
    loop_match_minimum_chain_size: 5        # Smaller chain
    loop_match_maximum_variance_coarse: 1.0 # Stricter variance
    loop_match_minimum_response_coarse: 0.4 # Higher threshold
    loop_match_minimum_response_fine: 0.6   # Higher threshold

    # Correlation params (optimized for scan matching)
    correlation_search_space_dimension: 0.3  # Smaller search space
    correlation_search_space_resolution: 0.005  # Higher resolution
    correlation_search_space_smear_deviation: 0.05  # Less smearing

    # Loop closure params (minimal)
    loop_search_space_dimension: 3.0         # Smaller search
    loop_search_space_resolution: 0.02       # Higher resolution
    loop_search_space_smear_deviation: 0.01  # Precise matching

    # Scan matcher params (key for Hector-like behavior)
    distance_variance_penalty: 0.3      # Lower penalty for smoother tracking
    angle_variance_penalty: 0.5         # Lower penalty for smoother tracking

    fine_search_angle_offset: 0.00175   # ~0.1 degrees - very fine
    coarse_search_angle_offset: 0.0175  # ~1 degree
    coarse_angle_resolution: 0.0175     # ~1 degree resolution
    minimum_angle_penalty: 0.7          # More forgiving
    minimum_distance_penalty: 0.3       # More forgiving
    use_response_expansion: true         # Improve scan matching