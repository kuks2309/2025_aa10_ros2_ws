lane_detection_node:
  ros__parameters:
    # YOLOv8 모델 경로 (asw_predict.py와 동일한 상대 경로 사용)
    model_path: 'runs/segment/train/weights/best.pt'
    
    # 검출 신뢰도 임계값 (0.0 ~ 1.0)
    conf_threshold: 0.3
    
    # Anchor line 설정 파일 경로
    anchor_config_file: 'config/anchor_config.json'
    
    # 디버그 이미지 표시 여부
    show_debug_image: true
    
    # 이미지 크기 설정
    image_width: 640
    image_height: 480
    
    # Anchor line 기본 위치 (픽셀 단위, y 좌표)
    default_anchor_lines: [200, 250, 300, 350, 400, 450]
    
    # 차량 영역 비율 (이미지 크기 대비)
    car_region:
      x1_ratio: 0.25  # 왼쪽 경계 (width * 0.25)
      x2_ratio: 0.75  # 오른쪽 경계 (width * 0.75)
      y1_ratio: 0.65  # 위쪽 경계 (height * 0.65)
      y2_ratio: 0.95  # 아래쪽 경계 (height * 0.95)
    
    # 시각화 설정
    visualization:
      overlay_alpha: 0.4  # 마스크 오버레이 투명도
      anchor_line_color: [0, 0, 255]  # 빨간색 (BGR)
      center_point_color: [0, 255, 0]  # 초록색 (BGR)
      center_line_color: [0, 255, 0]   # 초록색 (BGR)
      anchor_line_thickness: 2
      center_line_thickness: 3
      center_point_radius: 4